<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generador de Contraseñas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="contenedor">

        <h1>🔐 Generador de Contraseñas</h1>

        <p class="descripcion">
            Crea una contraseña segura 
        </p>

        <div class="resultado">

            <input
                type="text"
                id="password"
                readonly
                placeholder="Tu contraseña aparecerá aquí"
            >

            <button id="copiar">
                Copiar
            </button>

        </div>

        <div class="opciones">


            <div class="fila">

                <label for="longitud">
                    Tamaño de la contraseña:
                </label>

                <input
                    type="number"
                    id="longitud"
                    min="8"
                    max="50"
                    value="12"
                >

            </div>

            <div class="opcion">

                <input
                    type="checkbox"
                    id="mayusculas"
                    checked
                >

                <label for="mayusculas">
                    Letras mayúsculas (A-Z)
                </label>

            </div>

            <div class="opcion">

                <input
                    type="checkbox"
                    id="minusculas"
                    checked
                >

                <label for="minusculas">
                    Letras minúsculas (a-z)
                </label>

            </div>


            <div class="opcion">

                <input
                    type="checkbox"
                    id="numeros"
                    checked
                >

                <label for="numeros">
                    Números (0-9)
                </label>

            </div>

            <div class="opcion">

                <input
                    type="checkbox"
                    id="simbolos"
                >

                <label for="simbolos">
                    Símbolos (!@#$%)
                </label>

            </div>

        </div>

        <button
            class="generar"
            id="generar"
        >
            Generar Password
        </button>


        <p id="mensaje"></p>

    </div>


    <script src="script.js"></script>

</body>

</html>
